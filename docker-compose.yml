services:
  db:
    image: pgvector/pgvector:pg16
    container_name: commission-pg
    environment:
      POSTGRES_USER: comm
      POSTGRES_PASSWORD: comm_local_pw
      POSTGRES_DB: commission
      TZ: UTC
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comm -d commission"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - commission_pgdata:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "timezone=UTC"
      - "-c"
      - "max_connections=100"

volumes:
  commission_pgdata:
